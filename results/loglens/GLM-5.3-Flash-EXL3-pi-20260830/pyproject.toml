[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "1.0.0"
description = "Log analysis CLI & library: normalize JSON/plain-text logs, detect anomalies, build actionable reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
loglens = "loglens.cli:app"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.setuptools.package-data]
loglens = ["py.typed", "reporters/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["loglens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may keep compact local fixtures and long parameter lists.
"tests/*" = ["E501"]
